<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Social links profile</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div class="container">
    <!-- Profile picture -->
    <div class="profile-container">
      <img src="./assets/images/avatar-jessica.jpeg" alt="User profile picture" class="profile-image">
    </div>
    <!-- Profile info -->
    <div class="profile-info-container">
      <h3 class="username">Jessica Randall</h3>
      <p class="location">London, United Kingdom</p>
      <p class="job-description">"Front-end developer and avid reader."</p>
    </div>
    <!-- Social links -->
     <a href="#" class="social-link">GitHub</a>
     <a href="#" class="social-link">Frontend Mentor</a>
     <a href="#" class="social-link">LinkedIn</a>
     <a href="#" class="social-link">Twitter</a>
     <a href="#" class="social-link">Instagram</a>
  </div>

</body>

</html>
